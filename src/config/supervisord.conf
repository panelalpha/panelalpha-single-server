[supervisord]
nodaemon=true
logfile=/app/data/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:php-fpm]
command=php-fpm8.5 -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -c "/app/config/nginx.conf" -g "daemon off;"
# command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=php /app/backend/artisan reverb:start --no-interaction
directory=/app/backend
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Two workers.
;   fast: Engine task polling, notifications, sync (connection `database`,
;         retry_after 150 > --timeout 120).
;   long: WordPress install/update, backups (connection `database-long`,
;         retry_after 1900 > --timeout 1800).
; stopwaitsecs is above the worker timeout so a job is never killed mid-run
; while another worker could still pick it up.
[program:queue-worker]
command=php /app/backend/artisan queue:work database --queue=engine-tasks,default,sync --sleep=1 --tries=1 --timeout=120 --max-time=3600
directory=/app/backend
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=130
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker-long]
command=php /app/backend/artisan queue:work database-long --queue=long --sleep=1 --tries=1 --timeout=1800 --max-time=3600
directory=/app/backend
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=1810
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Run the Laravel scheduler (sync, thumbnails, automatic backups…).
[program:scheduler]
command=php /app/backend/artisan schedule:work --no-interaction
directory=/app/backend
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
