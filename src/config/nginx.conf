user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /app/data/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    # client_max_body_size is written to /etc/nginx/conf.d by entrypoint.sh from
    # USER_APPLICATION_UPLOAD_MAX_BYTES, the same value PHP and the fm SPA get
    #Never hard-code it here: nginx includes conf.d below.
    #
    # The real_ip trust is generated at container start too
    # (write-trusted-proxies.sh -> conf.d/01-panelalpha-real-ip.conf): nginx
    # trusts X-Forwarded-For only from TRUSTED_FRONT_PROXIES, empty by default
    #Never hard-code a Docker range here.
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    access_log /app/data/nginx/access.log;
    gzip on;
    include /etc/nginx/conf.d/*.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # The SPA a host name is served: the Client Area unless a line below names
    # another. Every host reaches the same server, /api and /ws.
    map $host $panelalpha_spa_root {
        default    /app/frontend/dist;
    }

    # index.html, index-seo.html and the translations under /locales/ (no content
    # hash in their names) must be revalidated on every visit so a new release
    # is visible at once and new code never meets old translation keys. $uri is
    # the final URI after the `index` and try_files internal redirects. An
    # empty value makes add_header skip the header, so every other file keeps
    # its current caching.
    map $uri $panelalpha_spa_cache_control {
        ~^/index(-seo)?\.html$  "no-cache";
        ~^/locales/             "no-cache";
        default                 "";
    }

    server {
        listen 80 default_server;
        server_name _;

        # With an https APP_URL, a visitor the trusted front proxy reports as
        # http is sent to https (the session cookies are Secure); generated at
        # container start by write-https-redirect.sh, a comment otherwise.
        include /etc/nginx/snippets/panelalpha-https-redirect.conf;

        # Every response carries the security headers (no framing, no content
        # sniffing, a referrer policy, HSTS when the panel URL is https);
        # generated at container start by write-security-headers.sh. A location
        # with its own add_header drops the server's whole set, so the ones
        # that set `Cache-Control` include the snippet again.
        include /etc/nginx/snippets/panelalpha-security-headers.conf;

        # A body over client_max_body_size is refused by nginx
        # before it reaches PHP, so answer a JSON 413 in the CA's error shape
        # (`{message}`) instead of nginx's HTML page. An upstream 413 (Laravel's
        # PostTooLargeException) is not intercepted and keeps its own JSON.
        error_page 413 = @panelalpha_json_413;
        location @panelalpha_json_413 {
            default_type application/json;
            return 413 '{"message":"The uploaded file is too large."}';
        }

        # Route-scoped request-path headroom for the long synchronous Engine
        # calls (project delete, retry-staging, upload-files, onboarding domain
        # wait); generated at container start.
        include /etc/nginx/snippets/panelalpha-long-call.conf;

        # An `index-seo.html` (the index with the panel's SEO meta tags) is
        # preferred over `index.html` where the image provides one; otherwise
        # `index.html` answers.
        location / {
            root $panelalpha_spa_root;
            index index-seo.html index.html;
            try_files $uri $uri/ /index-seo.html /index.html =404;

            # Static SPA files only (not /api, /mcp or /ws). `gzip on` is set in
            # the http block; text/html is always compressed.
            gzip_types text/css text/javascript application/javascript application/json
                       application/manifest+json image/svg+xml image/x-icon text/xml
                       application/xml font/ttf application/vnd.ms-fontobject;
            gzip_vary on;
            gzip_comp_level 5;
            gzip_min_length 1024;

            add_header Cache-Control $panelalpha_spa_cache_control;

            # A location with its own add_header drops the server's set.
            include /etc/nginx/snippets/panelalpha-security-headers.conf;

            # Files with a content hash in the name never change: webpack
            # /js|css|fonts|img/<name>.<hash8>.<ext>, Vite (the Client Area)
            # /assets/<name>-<hash8>.<ext>. The hash is exactly 8 chars
            # and [^/]+ keeps out sub-directories, so unhashed files (locales,
            # tinymce, favicons, Client Area /assets/img/flags) stay uncached.
            # =404 stops try_files from answering index.html with `immutable`
            # for a missing hashed file.
            location ~ "^/(?:(?:js|css|fonts|img)/[^/]+\.[0-9a-f]{8}\.[a-z0-9]+|assets/[^/]+-[A-Za-z0-9_-]{8}\.[a-z0-9]+)$" {
                try_files $uri =404;
                add_header Cache-Control "public, max-age=31536000, immutable";

                # A location with its own add_header drops the server's set.
                include /etc/nginx/snippets/panelalpha-security-headers.conf;
            }
        }

        location /api {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE_ADDR $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $server_name;
            # The Engine proxy terminates TLS and
            # sends X-Forwarded-Proto. Forward it only from a trusted front
            # proxy (real_ip then rewrote $remote_addr, so the peer differs);
            # an untrusted peer's header is replaced with the real scheme.
            set $panelalpha_forwarded_proto $scheme;
            if ($realip_remote_addr != $remote_addr) {
                set $panelalpha_forwarded_proto $http_x_forwarded_proto;
            }
            proxy_set_header X-Forwarded-Proto $panelalpha_forwarded_proto;
            proxy_pass http://127.0.0.1:82/api;
        }

        # Connect AI's MCP server: the CA builds `<panel>/mcp`
        # (ConnectAi.vue:150-153). Route it to the backend and disable proxy
        # buffering so each SSE chunk reaches the MCP client before the Engine
        # closes.
        location = /mcp {
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 1800s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://127.0.0.1:82;
        }

        location = /mcp/check {
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_read_timeout 1800s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass http://127.0.0.1:82;
        }

        # CA Echo wsPath=/ws → strip prefix for Reverb (/app/{key})
        location /ws {
            # The handshake answer stays the upstream's: any add_header here
            # replaces the server's set and an empty value writes nothing.
            add_header X-Panelalpha-None "";

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            rewrite ^/ws/?(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8080;
        }
    }

    # The backend server is an internal hop: only the container nginx (server
    # 80) may reach it. Binding the IPv4 loopback keeps a client on the
    # Docker network from bypassing the front server's routing.
    # Never add `listen [::1]:82`: where IPv6 is disabled that bind fails and
    # nginx refuses to start. The front servers reach it on
    # 127.0.0.1, never `localhost` (which may resolve to ::1 first).
    server {
        listen 127.0.0.1:82 default_server;
        server_name _;

        # Route-scoped request-path headroom for the long synchronous Engine
        # calls; generated at
        # container start.
        include /etc/nginx/snippets/panelalpha-long-call-backend.conf;

        root /app/backend/public;
        index index.php index.html index.htm;
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Connect AI's MCP pass-through: disable FastCGI
        # buffering so each streamed/SSE chunk reaches the client immediately,
        # and pass to the dedicated [stream] pool so an open MCP stream can
        # never occupy a www worker.
        location = /mcp {
            fastcgi_buffering off;
            fastcgi_read_timeout 1800s;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass unix:/var/run/php/php8.5-fpm-stream.sock;
        }

        location = /mcp/check {
            fastcgi_buffering off;
            fastcgi_read_timeout 1800s;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass unix:/var/run/php/php8.5-fpm-stream.sock;
        }
        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            # The front nginx sets X-Forwarded-Proto; pass it to
            # PHP so Laravel sees https behind the Engine proxy.
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        }
    }
}
